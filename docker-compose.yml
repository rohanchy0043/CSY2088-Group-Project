services:

  php:
    build:
      context: .
      dockerfile: PHP.Dockerfile
    container_name: php_app
    volumes:
      - ./SmartHostelManagementSystem:/var/www/html
    working_dir: /var/www/html
    command: php -S 0.0.0.0:8000 -t /var/www/html/public /var/www/html/public/router.php
    environment:
      DB_HOST: mysql
      DB_NAME: SmartHostel
      DB_USER: student
      DB_PASSWORD: student
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mariadb:latest
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: SmartHostel
      MYSQL_USER: student
      MYSQL_PASSWORD: student
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql 

  adminer:
    image: adminer:latest
    container_name: adminer_smarthostelmanagementsystem
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
